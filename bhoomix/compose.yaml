services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
    env_file:
      - .env.local
    environment:
      AI_INFERENCE_URL: http://ai:8000/predict
    ports:
      - "3000:3000"
    depends_on:
      ai:
        condition: service_healthy
    restart: unless-stopped

  ai:
    build:
      context: .
      dockerfile: Dockerfile.ai
    environment:
      ROOFTOP_MODEL_PATH: /models/best.pt
    volumes:
      - ./training/runs/rooftop-baseline/best.pt:/models/best.pt:ro
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 15s
      timeout: 8s
      retries: 10
      start_period: 60s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
